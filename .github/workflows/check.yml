name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every plugin in the catalog reads, and every catalog entry points at a plugin
        run: python3 scripts/check_catalog.py
  cobol-lsp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q plugins/cobol-lsp/tests
